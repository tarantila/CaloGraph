# Standalone local development and explicitly selected isolated workflows.
# Profiles do not isolate projects: use the scripts/Make targets, never profile-wide up.
name: calograph-dev
services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-calograph}
      POSTGRES_USER: ${POSTGRES_USER:-calograph}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
    - postgres_password
    volumes:
    - dev-postgres-data:/var/lib/postgresql
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
    - dev-data
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETGID
    - SETUID
    stop_grace_period: 1m
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-0}
    cpus: ${POSTGRES_CPU_LIMIT:-0}
    pids_limit: ${POSTGRES_PIDS_LIMIT:--1}
  backend:
    image: calograph-backend-dev:${CALOGRAPH_DEV_VERSION:-edge}
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-development
      args:
        APP_VERSION: ${CALOGRAPH_DEV_VERSION:-edge}
        APP_UID: ${CALOGRAPH_UID:-10001}
        APP_GID: ${CALOGRAPH_GID:-10001}
    restart: unless-stopped
    environment:
      ENVIRONMENT: development
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-calograph}
      DATABASE_USER: ${POSTGRES_USER:-calograph}
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      SESSION_SECRET_FILE: /run/secrets/session_secret
      RATE_LIMIT_SECRET_FILE: /run/secrets/rate_limit_secret
      CREDENTIAL_ENCRYPTION_KEY_FILE: /run/secrets/credential_encryption_key
      MFA_ENCRYPTION_KEY_FILE: /run/secrets/mfa_encryption_key
      BACKUP_AGENT_ENABLED: "false"
      BACKUP_DATABASE_VERIFICATION_STATUS_FILE: ${BACKUP_DATABASE_VERIFICATION_STATUS_FILE:-/var/lib/calograph-backups/status/database-verification.json}
      BACKUP_SECRETS_VERIFICATION_STATUS_FILE: ${BACKUP_SECRETS_VERIFICATION_STATUS_FILE:-/var/lib/calograph-backups/status/secrets-verification.json}
      BACKUP_RESTORE_TEST_STATUS_FILE: ${BACKUP_RESTORE_TEST_STATUS_FILE:-/var/lib/calograph-backups/status/restore-test.json}
      BACKUP_RESTORE_TEST_INTERVAL_DAYS: ${BACKUP_RESTORE_TEST_INTERVAL_DAYS:-90}
      BACKUP_STATUS_MAX_AGE_SECONDS: ${BACKUP_STATUS_MAX_AGE_SECONDS:-172800}
      BACKUP_FRESHNESS_THRESHOLD_SECONDS: ${BACKUP_FRESHNESS_THRESHOLD_SECONDS:-172800}
      BACKUP_SCHEDULE_TIME: ${BACKUP_SCHEDULE_TIME:-02:30}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_INCLUDE_SECRETS: ${BACKUP_INCLUDE_SECRETS:-false}
      CALOGRAPH_TIMEZONE: ${CALOGRAPH_TIMEZONE:-Europe/Berlin}
      GOOGLE_HEALTH_ENABLED: ${GOOGLE_HEALTH_ENABLED:-false}
      WITHINGS_ENABLED: ${WITHINGS_ENABLED:-false}
      WITHINGS_REDIRECT_URI: ${WITHINGS_REDIRECT_URI-}
      INITIAL_ADMIN_SETUP_ENABLED: ${INITIAL_ADMIN_SETUP_ENABLED:-false}
      CALOGRAPH_PUBLIC_URL: ${CALOGRAPH_PUBLIC_URL:-http://localhost:8180}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-localhost,127.0.0.1}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://localhost:8180,http://127.0.0.1:8180}
      TRUSTED_PROXY_NETWORKS: ${CALOGRAPH_DEV_FRONTEND_PROXY_IP:-172.29.0.10}/32
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
      ENABLE_HSTS: ${ENABLE_HSTS:-false}
      HSTS_INCLUDE_SUBDOMAINS: ${HSTS_INCLUDE_SUBDOMAINS:-false}
      MAX_JSON_PAYLOAD_BYTES: ${MAX_JSON_PAYLOAD_BYTES:-10485760}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-524288000}
      MAX_ZIP_UNCOMPRESSED_BYTES: ${MAX_ZIP_UNCOMPRESSED_BYTES:-536870912}
      NGINX_MAX_UPLOAD_BYTES: ${NGINX_MAX_UPLOAD_BYTES:-536870912}
      BACKEND_TMPFS_BYTES: ${BACKEND_TMPFS_BYTES:-1090519040}
      MAX_ZIP_ENTRIES: ${MAX_ZIP_ENTRIES:-20}
      MAX_IMPORT_RECORDS: ${MAX_IMPORT_RECORDS:-1000000}
      MAX_IMPORT_SAMPLES: ${MAX_IMPORT_SAMPLES:-250000}
      MAX_IMPORT_ERRORS: ${MAX_IMPORT_ERRORS:-1000}
      MAX_IMPORT_UNKNOWN_TYPES: ${MAX_IMPORT_UNKNOWN_TYPES:-100}
      IMPORT_BATCH_SIZE: ${IMPORT_BATCH_SIZE:-500}
      RAW_PAYLOAD_RETENTION_DAYS: ${RAW_PAYLOAD_RETENTION_DAYS:-0}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10}
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-900}
      LOGIN_IP_RATE_LIMIT: ${LOGIN_IP_RATE_LIMIT:-30}
      LOGIN_IP_RATE_LIMIT_WINDOW_SECONDS: ${LOGIN_IP_RATE_LIMIT_WINDOW_SECONDS:-300}
      PASSWORD_CHANGE_RATE_LIMIT: ${PASSWORD_CHANGE_RATE_LIMIT:-5}
      PASSWORD_CHANGE_RATE_LIMIT_WINDOW_SECONDS: ${PASSWORD_CHANGE_RATE_LIMIT_WINDOW_SECONDS:-900}
      RECOVERY_RATE_LIMIT: ${RECOVERY_RATE_LIMIT:-10}
      RECOVERY_IP_RATE_LIMIT: ${RECOVERY_IP_RATE_LIMIT:-30}
      RECOVERY_RATE_LIMIT_WINDOW_SECONDS: ${RECOVERY_RATE_LIMIT_WINDOW_SECONDS:-900}
      MFA_RATE_LIMIT: ${MFA_RATE_LIMIT:-10}
      MFA_RATE_LIMIT_WINDOW_SECONDS: ${MFA_RATE_LIMIT_WINDOW_SECONDS:-300}
      MFA_IP_RATE_LIMIT: ${MFA_IP_RATE_LIMIT:-30}
      PASSKEY_IP_RATE_LIMIT: ${PASSKEY_IP_RATE_LIMIT:-30}
      PASSKEY_RATE_LIMIT_WINDOW_SECONDS: ${PASSKEY_RATE_LIMIT_WINDOW_SECONDS:-300}
      SESSION_IDLE_TIMEOUT_HOURS: ${SESSION_IDLE_TIMEOUT_HOURS:-168}
      SESSION_ABSOLUTE_TIMEOUT_DAYS: ${SESSION_ABSOLUTE_TIMEOUT_DAYS:-30}
      RATE_LIMIT_RETENTION_HOURS: ${RATE_LIMIT_RETENTION_HOURS:-24}
      SECURITY_AUDIT_RETENTION_DAYS: ${SECURITY_AUDIT_RETENTION_DAYS:-90}
      SECURITY_AUDIT_GEOIP_PROVIDER: ${SECURITY_AUDIT_GEOIP_PROVIDER:-disabled}
      SECURITY_AUDIT_GEOIP_TIMEOUT_SECONDS: ${SECURITY_AUDIT_GEOIP_TIMEOUT_SECONDS:-2}
      SECURITY_AUDIT_GEOIP_CACHE_SECONDS: ${SECURITY_AUDIT_GEOIP_CACHE_SECONDS:-3600}
      RELEASE_STATUS_ENABLED: ${RELEASE_STATUS_ENABLED:-false}
      ANALYTICS_DAILY_SHADOW_READ_ENABLED: ${ANALYTICS_DAILY_SHADOW_READ_ENABLED:-false}
      ANALYTICS_DAILY_SHADOW_MAX_DAYS: ${ANALYTICS_DAILY_SHADOW_MAX_DAYS:-31}
      ANALYTICS_MICRONUTRIENTS_SHADOW_READ_ENABLED: ${ANALYTICS_MICRONUTRIENTS_SHADOW_READ_ENABLED:-false}
      ANALYTICS_MICRONUTRIENTS_SHADOW_MAX_DAYS: ${ANALYTICS_MICRONUTRIENTS_SHADOW_MAX_DAYS:-31}
      ANALYTICS_MICRONUTRIENTS_METADATA_SHADOW_ENABLED: ${ANALYTICS_MICRONUTRIENTS_METADATA_SHADOW_ENABLED:-false}
      ANALYTICS_MICRONUTRIENTS_PUBLIC_PROVIDER_METADATA_ENABLED: ${ANALYTICS_MICRONUTRIENTS_PUBLIC_PROVIDER_METADATA_ENABLED:-false}
      ANALYTICS_MICRONUTRIENTS_CANONICAL_READ_ENABLED: ${ANALYTICS_MICRONUTRIENTS_CANONICAL_READ_ENABLED:-false}
      ANALYTICS_DAILY_CANONICAL_READ_ENABLED: ${ANALYTICS_DAILY_CANONICAL_READ_ENABLED:-false}
      ANALYTICS_CALENDAR_CANONICAL_READ_ENABLED: ${ANALYTICS_CALENDAR_CANONICAL_READ_ENABLED:-false}
      ANALYTICS_WEEKLY_CANONICAL_READ_ENABLED: ${ANALYTICS_WEEKLY_CANONICAL_READ_ENABLED:-false}
      ANALYTICS_WEEKDAYS_CANONICAL_READ_ENABLED: ${ANALYTICS_WEEKDAYS_CANONICAL_READ_ENABLED:-false}
      ANALYTICS_TRENDS_CANONICAL_READ_ENABLED: ${ANALYTICS_TRENDS_CANONICAL_READ_ENABLED:-false}
      IMPORT_RATE_LIMIT: ${IMPORT_RATE_LIMIT:-30}
      IMPORT_RATE_LIMIT_WINDOW_SECONDS: ${IMPORT_RATE_LIMIT_WINDOW_SECONDS:-60}
      IMPORT_IP_RATE_LIMIT: ${IMPORT_IP_RATE_LIMIT:-60}
      RECONCILE_RATE_LIMIT: ${RECONCILE_RATE_LIMIT:-12}
      RECONCILE_IP_RATE_LIMIT: ${RECONCILE_IP_RATE_LIMIT:-24}
      RECONCILE_RATE_LIMIT_WINDOW_SECONDS: ${RECONCILE_RATE_LIMIT_WINDOW_SECONDS:-300}
      FILE_IMPORT_USER_RATE_LIMIT: ${FILE_IMPORT_USER_RATE_LIMIT:-3}
      FILE_IMPORT_IP_RATE_LIMIT: ${FILE_IMPORT_IP_RATE_LIMIT:-6}
      FILE_IMPORT_RATE_LIMIT_WINDOW_SECONDS: ${FILE_IMPORT_RATE_LIMIT_WINDOW_SECONDS:-3600}
      YAZIO_ENABLED: ${YAZIO_ENABLED:-true}
      YAZIO_SCHEDULER_ENABLED: ${YAZIO_SCHEDULER_ENABLED:-true}
      YAZIO_SDK_CLIENT_ID: ${YAZIO_SDK_CLIENT_ID-}
      YAZIO_SDK_CLIENT_SECRET: ${YAZIO_SDK_CLIENT_SECRET-}
      YAZIO_SYNC_INTERVAL_HOURS: ${YAZIO_SYNC_INTERVAL_HOURS:-6}
      YAZIO_SYNC_DAYS: ${YAZIO_SYNC_DAYS:-7}
      YAZIO_CONNECT_TIMEOUT_SECONDS: ${YAZIO_CONNECT_TIMEOUT_SECONDS:-3.05}
      YAZIO_READ_TIMEOUT_SECONDS: ${YAZIO_READ_TIMEOUT_SECONDS:-15}
      YAZIO_LOGIN_DEADLINE_SECONDS: ${YAZIO_LOGIN_DEADLINE_SECONDS:-25}
      YAZIO_OPERATION_DEADLINE_SECONDS: ${YAZIO_OPERATION_DEADLINE_SECONDS:-300}
      YAZIO_REQUEST_WORKERS: ${YAZIO_REQUEST_WORKERS:-3}
      YAZIO_RATE_LIMIT: ${YAZIO_RATE_LIMIT:-2}
      YAZIO_RATE_LIMIT_WINDOW_SECONDS: ${YAZIO_RATE_LIMIT_WINDOW_SECONDS:-600}
      YAZIO_MAX_PARALLEL_OPERATIONS: ${YAZIO_MAX_PARALLEL_OPERATIONS:-2}
      YAZIO_CIRCUIT_FAILURE_LIMIT: ${YAZIO_CIRCUIT_FAILURE_LIMIT:-5}
      YAZIO_CIRCUIT_WINDOW_SECONDS: ${YAZIO_CIRCUIT_WINDOW_SECONDS:-600}
      YAZIO_SCHEDULER_POLL_SECONDS: ${YAZIO_SCHEDULER_POLL_SECONDS:-60}
      YAZIO_SCHEDULER_JITTER_MINUTES: ${YAZIO_SCHEDULER_JITTER_MINUTES:-30}
      ASGI_APP: ${ASGI_APP:-app.main:app}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      UVICORN_LOG_LEVEL: ${UVICORN_LOG_LEVEL:-info}
      UVICORN_TIMEOUT_KEEP_ALIVE: ${UVICORN_TIMEOUT_KEEP_ALIVE:-5}
      UVICORN_TIMEOUT_GRACEFUL_SHUTDOWN: ${UVICORN_TIMEOUT_GRACEFUL_SHUTDOWN:-30}
      UVICORN_ACCESS_LOG: ${UVICORN_ACCESS_LOG:-true}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    secrets:
    - postgres_password
    - session_secret
    - rate_limit_secret
    - credential_encryption_key
    - mfa_encryption_key
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -m
      - app.healthcheck
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      dev-edge: null
      dev-data: null
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    init: true
    stop_grace_period: 30s
    read_only: false
    mem_limit: ${BACKEND_MEMORY_LIMIT:-0}
    cpus: ${BACKEND_CPU_LIMIT:-0}
    pids_limit: ${BACKEND_PIDS_LIMIT:--1}
    tmpfs:
    - /tmp:size=${BACKEND_TMPFS_BYTES:-1090519040},mode=1777
    volumes:
    - ./backend:/app
    pull_policy: never
    command:
    - sh
    - -ec
    - >-
      if [ "$$RUN_MIGRATIONS" = true ]; then alembic upgrade head; fi;
      exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      --proxy-headers --forwarded-allow-ips "$$TRUSTED_PROXY_NETWORKS"
  yazio-scheduler:
    image: calograph-backend-dev:${CALOGRAPH_DEV_VERSION:-edge}
    restart: unless-stopped
    command:
    - python
    - -m
    - app.cli
    - run-yazio-scheduler
    environment:
      ENVIRONMENT: development
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-calograph}
      DATABASE_USER: ${POSTGRES_USER:-calograph}
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      RATE_LIMIT_SECRET_FILE: /run/secrets/rate_limit_secret
      CREDENTIAL_ENCRYPTION_KEY_FILE: /run/secrets/credential_encryption_key
      YAZIO_ENABLED: ${YAZIO_ENABLED:-true}
      YAZIO_SCHEDULER_ENABLED: ${YAZIO_SCHEDULER_ENABLED:-true}
      YAZIO_SDK_CLIENT_ID: ${YAZIO_SDK_CLIENT_ID-}
      YAZIO_SDK_CLIENT_SECRET: ${YAZIO_SDK_CLIENT_SECRET-}
      YAZIO_SYNC_INTERVAL_HOURS: ${YAZIO_SYNC_INTERVAL_HOURS:-6}
      YAZIO_SYNC_DAYS: ${YAZIO_SYNC_DAYS:-7}
      YAZIO_CONNECT_TIMEOUT_SECONDS: ${YAZIO_CONNECT_TIMEOUT_SECONDS:-3.05}
      YAZIO_READ_TIMEOUT_SECONDS: ${YAZIO_READ_TIMEOUT_SECONDS:-15}
      YAZIO_LOGIN_DEADLINE_SECONDS: ${YAZIO_LOGIN_DEADLINE_SECONDS:-25}
      YAZIO_OPERATION_DEADLINE_SECONDS: ${YAZIO_OPERATION_DEADLINE_SECONDS:-300}
      YAZIO_REQUEST_WORKERS: ${YAZIO_REQUEST_WORKERS:-3}
      YAZIO_MAX_PARALLEL_OPERATIONS: ${YAZIO_MAX_PARALLEL_OPERATIONS:-2}
      YAZIO_CIRCUIT_FAILURE_LIMIT: ${YAZIO_CIRCUIT_FAILURE_LIMIT:-5}
      YAZIO_CIRCUIT_WINDOW_SECONDS: ${YAZIO_CIRCUIT_WINDOW_SECONDS:-600}
      YAZIO_SCHEDULER_POLL_SECONDS: ${YAZIO_SCHEDULER_POLL_SECONDS:-60}
      YAZIO_SCHEDULER_JITTER_MINUTES: ${YAZIO_SCHEDULER_JITTER_MINUTES:-30}
      SESSION_IDLE_TIMEOUT_HOURS: ${SESSION_IDLE_TIMEOUT_HOURS:-168}
      SESSION_ABSOLUTE_TIMEOUT_DAYS: ${SESSION_ABSOLUTE_TIMEOUT_DAYS:-30}
      RATE_LIMIT_RETENTION_HOURS: ${RATE_LIMIT_RETENTION_HOURS:-24}
      SECURITY_AUDIT_RETENTION_DAYS: ${SECURITY_AUDIT_RETENTION_DAYS:-90}
      SECURITY_AUDIT_GEOIP_PROVIDER: ${SECURITY_AUDIT_GEOIP_PROVIDER:-disabled}
      SECURITY_AUDIT_GEOIP_TIMEOUT_SECONDS: ${SECURITY_AUDIT_GEOIP_TIMEOUT_SECONDS:-2}
      SECURITY_AUDIT_GEOIP_CACHE_SECONDS: ${SECURITY_AUDIT_GEOIP_CACHE_SECONDS:-3600}
    secrets:
    - postgres_password
    - rate_limit_secret
    - credential_encryption_key
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import os,time; from pathlib import Path; p=Path('/tmp/yazio-scheduler-heartbeat'); poll=int(os.environ.get('YAZIO_SCHEDULER_POLL_SECONDS','60'));
        deadline=int(os.environ.get('YAZIO_OPERATION_DEADLINE_SECONDS','300')); raise SystemExit(0 if p.exists() and time.time()-p.stat().st_mtime
        < max(poll+120,deadline+poll+60) else 1)
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
    - dev-data
    - dev-egress
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    init: true
    stop_grace_period: 30s
    read_only: true
    mem_limit: ${YAZIO_SCHEDULER_MEMORY_LIMIT:-0}
    cpus: ${YAZIO_SCHEDULER_CPU_LIMIT:-0}
    pids_limit: ${YAZIO_SCHEDULER_PIDS_LIMIT:--1}
    tmpfs:
    - /tmp:size=64m,mode=1777
    pull_policy: never
  frontend:
    image: calograph-frontend-dev:${CALOGRAPH_DEV_VERSION:-edge}
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-development
      args:
        APP_VERSION: ${CALOGRAPH_DEV_VERSION:-edge}
    restart: unless-stopped
    environment:
      ENABLE_HSTS: ${ENABLE_HSTS:-false}
      HSTS_INCLUDE_SUBDOMAINS: ${HSTS_INCLUDE_SUBDOMAINS:-false}
      NGINX_MAX_UPLOAD_BYTES: ${NGINX_MAX_UPLOAD_BYTES:-536870912}
      CALOGRAPH_EDGE_GATEWAY_IP: ${CALOGRAPH_DEV_EDGE_GATEWAY_IP:-172.29.0.1}
    ports:
    - ${CALOGRAPH_BIND_ADDRESS:-127.0.0.1}:${CALOGRAPH_PORT:-8180}:5173
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1:5173/
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      dev-edge:
        ipv4_address: ${CALOGRAPH_DEV_FRONTEND_PROXY_IP:-172.29.0.10}
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    init: true
    stop_grace_period: 30s
    read_only: false
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-0}
    cpus: ${FRONTEND_CPU_LIMIT:-0}
    pids_limit: ${FRONTEND_PIDS_LIMIT:--1}
    tmpfs:
    - /tmp:size=64m,mode=1777
    pull_policy: never
    command:
    - npm
    - run
    - dev
    - --
    - --host
    - 0.0.0.0
    volumes:
    - ./frontend:/app
    - frontend-node-modules:/app/node_modules
  frontend-ci:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-development
    command:
    - npm
    - run
    - test:unit
    networks:
    - test-edge
    profiles:
    - test
  backend-ci:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-development
    environment:
      ENVIRONMENT: test
    command:
    - pytest
    networks:
    - test-data
    volumes:
    - ./.env.example:/workspace/.env.example:ro
    - ./.env.production.example:/workspace/.env.production.example:ro
    - ./.github:/workspace/.github:ro
    - ./Dockerfile:/workspace/Dockerfile:ro
    - ./THIRD_PARTY_NOTICES.md:/workspace/THIRD_PARTY_NOTICES.md:ro
    - ./THIRD_PARTY_LICENSES:/workspace/THIRD_PARTY_LICENSES:ro
    - ./docker-compose.yml:/workspace/docker-compose.yml:ro
    - ./docker-compose-dev.yml:/workspace/docker-compose-dev.yml:ro
    - ./scripts:/workspace/scripts:ro
    profiles:
    - test
  postgres-ci:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: calograph_test
      POSTGRES_USER: calograph_test
      POSTGRES_PASSWORD: calograph-test-password
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U calograph_test -d calograph_test
      interval: 2s
      timeout: 5s
      retries: 15
    tmpfs:
    - /var/lib/postgresql
    networks:
    - test-data
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETGID
    - SETUID
    profiles:
    - test
  backend-postgres-ci:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-development
    environment:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://calograph_test:calograph-test-password@postgres-ci:5432/calograph_test
      CALOGRAPH_POSTGRES_TEST_URL: postgresql+psycopg://calograph_test:calograph-test-password@postgres-ci:5432/calograph_test
      CALOGRAPH_ALLOW_DESTRUCTIVE_POSTGRES_TESTS: '1'
    depends_on:
      postgres-ci:
        condition: service_healthy
    command:
    - sh
    - -c
    - alembic upgrade head && pytest tests/test_rate_limit_postgres.py tests/test_account_recovery_postgres.py tests/test_user_lifecycle_migration_postgres.py
      tests/test_yazio_sync_postgres.py tests/test_yazio_migration_postgres.py tests/test_yazio_projection_pending_migration_postgres.py
      tests/test_target_maintenance_migration_postgres.py tests/test_activity_energy_targets_migration_postgres.py tests/test_user_onboarding_migration_postgres.py
      tests/test_analysis_preferences_migration_postgres.py tests/test_apple_health_nutrition_postgres.py
    networks:
    - test-data
    profiles:
    - test
  e2e-postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: calograph_test
      POSTGRES_USER: calograph_test
      POSTGRES_PASSWORD: calograph-test-password
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U calograph_test -d calograph_test
      interval: 2s
      timeout: 5s
      retries: 15
    tmpfs:
    - /var/lib/postgresql
    networks:
    - e2e-data
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETGID
    - SETUID
    profiles:
    - e2e
  e2e-backend:
    image: ${CALOGRAPH_BACKEND_IMAGE:-calograph-backend-test}:${CALOGRAPH_VERSION:-edge}
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-runtime
      args:
        APP_VERSION: ${CALOGRAPH_VERSION:-latest}
        APP_UID: ${CALOGRAPH_UID:-10001}
        APP_GID: ${CALOGRAPH_GID:-10001}
    restart: unless-stopped
    environment:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://calograph_test:calograph-test-password@e2e-postgres:5432/calograph_test
      SESSION_SECRET: synthetic-compose-session-secret-at-least-32-characters
      RATE_LIMIT_SECRET: synthetic-compose-rate-limit-secret-at-least-32-characters
      CREDENTIAL_ENCRYPTION_KEY: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
