[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "calograph-backend"
version = "0.7.0"
description = "Self-hosted Apple Health nutrition analytics backend"
license = "PolyForm-Noncommercial-1.0.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic==1.20.0",
  "argon2-cffi==25.1.0",
  "cryptography==50.0.2",
  "defusedxml==0.7.1",
  "fastapi==0.143.3",
  "httpx2==2.13.1",
  "psycopg[binary]==3.3.6",
  "pyotp==2.10.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.0",
  "python-multipart==0.0.32",
  "qrcode==8.2",
  "requests==2.34.2",
  "sqlalchemy==2.1.5",
  "uvicorn[standard]==0.54.0",
  "webauthn==3.0.1",
  "yazio-exporter==0.2.0",
  "yazio-sdk==0.4.0",
  "zstandard==0.25.0",
  "google-auth>=2.62.0",
  "google-auth-oauthlib>=1.5.0",
]

[project.optional-dependencies]
dev = [
  "hypothesis==6.170.1",
  "mypy==2.4.0",
  "pip-audit==2.10.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.17.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic"]
