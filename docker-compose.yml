name: calograph

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-calograph}
      POSTGRES_USER: ${POSTGRES_USER:-calograph}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [data]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    logging: *default-logging
    stop_grace_period: 1m
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-0}
    cpus: ${POSTGRES_CPU_LIMIT:-0}
    pids_limit: ${POSTGRES_PIDS_LIMIT:--1}

  backend:
    image: calograph-backend:${CALOGRAPH_VERSION:-0.1.2}
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-runtime
      args:
        APP_VERSION: ${CALOGRAPH_VERSION:-0.1.2}
        APP_UID: ${CALOGRAPH_UID:-10001}
        APP_GID: ${CALOGRAPH_GID:-10001}
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:?Set ENVIRONMENT to development, test, or production in .env}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-calograph}
      DATABASE_USER: ${POSTGRES_USER:-calograph}
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      SESSION_SECRET_FILE: /run/secrets/session_secret
      RATE_LIMIT_SECRET_FILE: /run/secrets/rate_limit_secret
      CREDENTIAL_ENCRYPTION_KEY_FILE: /run/secrets/credential_encryption_key
      MFA_ENCRYPTION_KEY_FILE: /run/secrets/mfa_encryption_key
      CALOGRAPH_TIMEZONE: ${CALOGRAPH_TIMEZONE:-Europe/Berlin}
      CALOGRAPH_PUBLIC_URL: ${CALOGRAPH_PUBLIC_URL:?Set CALOGRAPH_PUBLIC_URL in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:?Set COOKIE_SECURE in .env}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:?Set TRUSTED_HOSTS in .env}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:?Set TRUSTED_ORIGINS in .env}
      TRUSTED_PROXY_NETWORKS: ${TRUSTED_PROXY_NETWORKS:?Set TRUSTED_PROXY_NETWORKS in .env}
      ENABLE_HSTS: ${ENABLE_HSTS:?Set ENABLE_HSTS in .env}
      MAX_JSON_PAYLOAD_BYTES: ${MAX_JSON_PAYLOAD_BYTES:-10485760}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-524288000}
      MAX_ZIP_UNCOMPRESSED_BYTES: ${MAX_ZIP_UNCOMPRESSED_BYTES:-2147483648}
      NGINX_MAX_UPLOAD_BYTES: ${NGINX_MAX_UPLOAD_BYTES:-536870912}
      BACKEND_TMPFS_BYTES: ${BACKEND_TMPFS_BYTES:-629145600}
      MAX_ZIP_ENTRIES: ${MAX_ZIP_ENTRIES:-20}
      MAX_IMPORT_RECORDS: ${MAX_IMPORT_RECORDS:-1000000}
      MAX_IMPORT_SAMPLES: ${MAX_IMPORT_SAMPLES:-250000}
      MAX_IMPORT_ERRORS: ${MAX_IMPORT_ERRORS:-1000}
      MAX_IMPORT_UNKNOWN_TYPES: ${MAX_IMPORT_UNKNOWN_TYPES:-100}
      IMPORT_BATCH_SIZE: ${IMPORT_BATCH_SIZE:-500}
      RAW_PAYLOAD_RETENTION_DAYS: ${RAW_PAYLOAD_RETENTION_DAYS:-0}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10}
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-900}
      LOGIN_IP_RATE_LIMIT: ${LOGIN_IP_RATE_LIMIT:-30}
      LOGIN_IP_RATE_LIMIT_WINDOW_SECONDS: ${LOGIN_IP_RATE_LIMIT_WINDOW_SECONDS:-300}
      PASSWORD_CHANGE_RATE_LIMIT: ${PASSWORD_CHANGE_RATE_LIMIT:-5}
      PASSWORD_CHANGE_RATE_LIMIT_WINDOW_SECONDS: ${PASSWORD_CHANGE_RATE_LIMIT_WINDOW_SECONDS:-900}
      MFA_RATE_LIMIT: ${MFA_RATE_LIMIT:-10}
      MFA_RATE_LIMIT_WINDOW_SECONDS: ${MFA_RATE_LIMIT_WINDOW_SECONDS:-300}
      MFA_IP_RATE_LIMIT: ${MFA_IP_RATE_LIMIT:-30}
      SESSION_IDLE_TIMEOUT_HOURS: ${SESSION_IDLE_TIMEOUT_HOURS:-24}
      SESSION_ABSOLUTE_TIMEOUT_DAYS: ${SESSION_ABSOLUTE_TIMEOUT_DAYS:-30}
      RATE_LIMIT_RETENTION_HOURS: ${RATE_LIMIT_RETENTION_HOURS:-24}
      IMPORT_RATE_LIMIT: ${IMPORT_RATE_LIMIT:-30}
      IMPORT_RATE_LIMIT_WINDOW_SECONDS: ${IMPORT_RATE_LIMIT_WINDOW_SECONDS:-60}
      IMPORT_IP_RATE_LIMIT: ${IMPORT_IP_RATE_LIMIT:-60}
      FILE_IMPORT_USER_RATE_LIMIT: ${FILE_IMPORT_USER_RATE_LIMIT:-3}
      FILE_IMPORT_IP_RATE_LIMIT: ${FILE_IMPORT_IP_RATE_LIMIT:-6}
      FILE_IMPORT_RATE_LIMIT_WINDOW_SECONDS: ${FILE_IMPORT_RATE_LIMIT_WINDOW_SECONDS:-3600}
      YAZIO_ENABLED: ${YAZIO_ENABLED:-true}
      YAZIO_CONNECT_TIMEOUT_SECONDS: ${YAZIO_CONNECT_TIMEOUT_SECONDS:-3.05}
      YAZIO_READ_TIMEOUT_SECONDS: ${YAZIO_READ_TIMEOUT_SECONDS:-15}
      YAZIO_LOGIN_DEADLINE_SECONDS: ${YAZIO_LOGIN_DEADLINE_SECONDS:-25}
      YAZIO_OPERATION_DEADLINE_SECONDS: ${YAZIO_OPERATION_DEADLINE_SECONDS:-300}
      YAZIO_REQUEST_WORKERS: ${YAZIO_REQUEST_WORKERS:-3}
      YAZIO_RATE_LIMIT: ${YAZIO_RATE_LIMIT:-2}
      YAZIO_RATE_LIMIT_WINDOW_SECONDS: ${YAZIO_RATE_LIMIT_WINDOW_SECONDS:-600}
      YAZIO_MAX_PARALLEL_OPERATIONS: ${YAZIO_MAX_PARALLEL_OPERATIONS:-2}
      YAZIO_CIRCUIT_FAILURE_LIMIT: ${YAZIO_CIRCUIT_FAILURE_LIMIT:-5}
      YAZIO_CIRCUIT_WINDOW_SECONDS: ${YAZIO_CIRCUIT_WINDOW_SECONDS:-600}
      YAZIO_SCHEDULER_POLL_SECONDS: ${YAZIO_SCHEDULER_POLL_SECONDS:-60}
      YAZIO_SCHEDULER_JITTER_MINUTES: ${YAZIO_SCHEDULER_JITTER_MINUTES:-30}
      ASGI_APP: ${ASGI_APP:-app.main:app}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      UVICORN_LOG_LEVEL: ${UVICORN_LOG_LEVEL:-info}
      UVICORN_TIMEOUT_KEEP_ALIVE: ${UVICORN_TIMEOUT_KEEP_ALIVE:-5}
      UVICORN_TIMEOUT_GRACEFUL_SHUTDOWN: ${UVICORN_TIMEOUT_GRACEFUL_SHUTDOWN:-30}
      UVICORN_ACCESS_LOG: ${UVICORN_ACCESS_LOG:-true}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    secrets:
      - postgres_password
      - session_secret
      - rate_limit_secret
      - credential_encryption_key
      - mfa_encryption_key
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [edge, data]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *default-logging
    init: true
    stop_grace_period: 30s
    read_only: true
    mem_limit: ${BACKEND_MEMORY_LIMIT:-0}
    cpus: ${BACKEND_CPU_LIMIT:-0}
    pids_limit: ${BACKEND_PIDS_LIMIT:--1}
    tmpfs:
      - /tmp:size=${BACKEND_TMPFS_BYTES:-629145600},mode=1777

  yazio-scheduler:
    image: calograph-backend:${CALOGRAPH_VERSION:-0.1.2}
    restart: unless-stopped
    command: ["python", "-m", "app.cli", "run-yazio-scheduler"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:?Set ENVIRONMENT to development, test, or production in .env}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-calograph}
      DATABASE_USER: ${POSTGRES_USER:-calograph}
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      RATE_LIMIT_SECRET_FILE: /run/secrets/rate_limit_secret
      CREDENTIAL_ENCRYPTION_KEY_FILE: /run/secrets/credential_encryption_key
      YAZIO_ENABLED: ${YAZIO_ENABLED:-true}
      YAZIO_CONNECT_TIMEOUT_SECONDS: ${YAZIO_CONNECT_TIMEOUT_SECONDS:-3.05}
      YAZIO_READ_TIMEOUT_SECONDS: ${YAZIO_READ_TIMEOUT_SECONDS:-15}
      YAZIO_LOGIN_DEADLINE_SECONDS: ${YAZIO_LOGIN_DEADLINE_SECONDS:-25}
      YAZIO_OPERATION_DEADLINE_SECONDS: ${YAZIO_OPERATION_DEADLINE_SECONDS:-300}
      YAZIO_REQUEST_WORKERS: ${YAZIO_REQUEST_WORKERS:-3}
      YAZIO_MAX_PARALLEL_OPERATIONS: ${YAZIO_MAX_PARALLEL_OPERATIONS:-2}
      YAZIO_CIRCUIT_FAILURE_LIMIT: ${YAZIO_CIRCUIT_FAILURE_LIMIT:-5}
      YAZIO_CIRCUIT_WINDOW_SECONDS: ${YAZIO_CIRCUIT_WINDOW_SECONDS:-600}
      YAZIO_SCHEDULER_POLL_SECONDS: ${YAZIO_SCHEDULER_POLL_SECONDS:-60}
      YAZIO_SCHEDULER_JITTER_MINUTES: ${YAZIO_SCHEDULER_JITTER_MINUTES:-30}
      SESSION_IDLE_TIMEOUT_HOURS: ${SESSION_IDLE_TIMEOUT_HOURS:-24}
      SESSION_ABSOLUTE_TIMEOUT_DAYS: ${SESSION_ABSOLUTE_TIMEOUT_DAYS:-30}
      RATE_LIMIT_RETENTION_HOURS: ${RATE_LIMIT_RETENTION_HOURS:-24}
    secrets:
      - postgres_password
      - rate_limit_secret
      - credential_encryption_key
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,time; from pathlib import Path; p=Path('/tmp/yazio-scheduler-heartbeat'); raise SystemExit(0 if p.exists() and time.time()-p.stat().st_mtime < int(os.environ.get('YAZIO_SCHEDULER_POLL_SECONDS','60'))+120 else 1)"
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [data, egress]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *default-logging
    init: true
    stop_grace_period: 30s
    read_only: true
    mem_limit: ${YAZIO_SCHEDULER_MEMORY_LIMIT:-0}
    cpus: ${YAZIO_SCHEDULER_CPU_LIMIT:-0}
    pids_limit: ${YAZIO_SCHEDULER_PIDS_LIMIT:--1}
    tmpfs:
      - /tmp:size=64m,mode=1777

  frontend:
    image: calograph-frontend:${CALOGRAPH_VERSION:-0.1.2}
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-runtime
      args:
        APP_VERSION: ${CALOGRAPH_VERSION:-0.1.2}
    restart: unless-stopped
    environment:
      ENABLE_HSTS: ${ENABLE_HSTS:?Set ENABLE_HSTS in .env}
      NGINX_MAX_UPLOAD_BYTES: ${NGINX_MAX_UPLOAD_BYTES:-536870912}
    ports:
      - "127.0.0.1:${CALOGRAPH_PORT:-8180}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [edge]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *default-logging
    init: true
    stop_grace_period: 30s
    read_only: true
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-0}
    cpus: ${FRONTEND_CPU_LIMIT:-0}
    pids_limit: ${FRONTEND_PIDS_LIMIT:--1}
    tmpfs:
      - /tmp:size=64m,mode=1777

  frontend-ci:
    profiles: [test]
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-build
    command: ["npm", "run", "test:unit"]
    networks: [edge]

  backend-ci:
    profiles: [test]
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-development
    environment:
      ENVIRONMENT: test
    command: ["pytest"]
    networks: [data]

  postgres-ci:
    profiles: [test]
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: calograph_test
      POSTGRES_USER: calograph_test
      POSTGRES_PASSWORD: calograph-test-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calograph_test -d calograph_test"]
      interval: 2s
      timeout: 5s
      retries: 15
    tmpfs:
      - /var/lib/postgresql
    networks: [data]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]

  backend-postgres-ci:
    profiles: [test]
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-development
    environment:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://calograph_test:calograph-test-password@postgres-ci:5432/calograph_test
      CALOGRAPH_POSTGRES_TEST_URL: postgresql+psycopg://calograph_test:calograph-test-password@postgres-ci:5432/calograph_test
      CALOGRAPH_ALLOW_DESTRUCTIVE_POSTGRES_TESTS: "1"
    depends_on:
      postgres-ci:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && pytest tests/test_rate_limit_postgres.py"]
    networks: [data]

  e2e:
    profiles: [test]
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-e2e
    environment:
      BASE_URL: http://frontend:8080
      EXPECT_HSTS: ${ENABLE_HSTS:?Set ENABLE_HSTS in .env}
    command: ["npx", "playwright", "test"]
    depends_on:
      frontend:
        condition: service_healthy
    networks: [edge]

networks:
  edge:
    driver: bridge
  data:
    driver: bridge
    internal: true
  egress:
    driver: bridge

volumes:
  postgres-data:

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:?Set POSTGRES_PASSWORD_FILE in .env}
  session_secret:
    file: ${SESSION_SECRET_FILE:?Set SESSION_SECRET_FILE in .env}
  rate_limit_secret:
    file: ${RATE_LIMIT_SECRET_FILE:?Set RATE_LIMIT_SECRET_FILE in .env}
  credential_encryption_key:
    file: ${CREDENTIAL_ENCRYPTION_KEY_FILE:?Set CREDENTIAL_ENCRYPTION_KEY_FILE in .env}
  mfa_encryption_key:
    file: ${MFA_ENCRYPTION_KEY_FILE:?Set MFA_ENCRYPTION_KEY_FILE in .env}
