services:
  backend:
    build:
      target: development
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend:/app
    read_only: false

  frontend:
    build:
      target: development
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports: !override
      - "127.0.0.1:${CALOGRAPH_PORT:-8180}:5173"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
    read_only: false

volumes:
  frontend-node-modules:
