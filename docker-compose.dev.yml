services:
  backend:
    image: calograph-backend-dev:${CALOGRAPH_VERSION:-0.6.5}
    build:
      target: backend-development
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --proxy-headers
      - --forwarded-allow-ips
      - "${CALOGRAPH_FRONTEND_PROXY_IP:-172.30.0.10}/32"
    environment:
      YAZIO_ENABLED: "true"
      YAZIO_SCHEDULER_ENABLED: "true"
    volumes:
      - ./backend:/app
    read_only: false

  yazio-scheduler:
    image: calograph-backend-dev:${CALOGRAPH_VERSION:-0.6.5}
    environment:
      YAZIO_ENABLED: "true"
      YAZIO_SCHEDULER_ENABLED: "true"
  withings-scheduler:
    image: calograph-backend-dev:${CALOGRAPH_VERSION:-0.6.5}
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-development
      args:
        APP_VERSION: ${CALOGRAPH_VERSION:-0.6.5}
        APP_UID: ${CALOGRAPH_UID:-10001}
        APP_GID: ${CALOGRAPH_GID:-10001}
    environment:
      WITHINGS_ENABLED: ${WITHINGS_ENABLED:-false}
      WITHINGS_SCHEDULER_ENABLED: ${WITHINGS_SCHEDULER_ENABLED:-false}

  frontend:
    image: calograph-frontend-dev:${CALOGRAPH_VERSION:-0.6.5}
    build:
      target: frontend-development
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports: !override
      - "${CALOGRAPH_BIND_ADDRESS:-127.0.0.1}:${CALOGRAPH_PORT:-8180}:5173"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
    read_only: false

volumes:
  frontend-node-modules:
