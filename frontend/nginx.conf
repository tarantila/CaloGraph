worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  map $http_x_forwarded_proto $calograph_forwarded_proto {
    default $scheme;
    http http;
    https https;
  }
  include /tmp/calograph-hsts-map.conf;
  map "$http_x_forwarded_proto:$host" $calograph_coop {
    default "";
    ~^https: "same-origin";
    ~^:localhost$ "same-origin";
    ~^:127\.0\.0\.1$ "same-origin";
  }
  map $uri $calograph_cache_control {
    default "private, no-store";
    ~*\.(?:js|css|woff2|png|svg)$ "public, max-age=604800, immutable";
  }
  access_log /dev/stdout combined;
  sendfile on;
  server_tokens off;
  client_max_body_size 12m;
  limit_conn_zone $server_name zone=large_uploads:10m;
  limit_req_zone $binary_remote_addr zone=large_upload_rate:10m rate=1r/m;
  limit_conn_status 429;
  limit_req_status 429;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy $calograph_coop always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Cache-Control $calograph_cache_control always;
    add_header Strict-Transport-Security $calograph_hsts always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    location = /health {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location = /api/v1/import/apple-health/file {
      include /tmp/calograph-upload-limit.conf;
      limit_conn large_uploads 1;
      limit_req zone=large_upload_rate burst=1 nodelay;
      proxy_pass http://backend:8000;
      proxy_http_version 1.1;
      proxy_hide_header X-Content-Type-Options;
      proxy_hide_header X-Frame-Options;
      proxy_hide_header Referrer-Policy;
      proxy_hide_header Permissions-Policy;
      proxy_hide_header Cross-Origin-Opener-Policy;
      proxy_hide_header Cross-Origin-Resource-Policy;
      proxy_hide_header X-Permitted-Cross-Domain-Policies;
      proxy_hide_header Cache-Control;
      proxy_hide_header Strict-Transport-Security;
      proxy_hide_header Content-Security-Policy;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $calograph_forwarded_proto;
      proxy_set_header X-Forwarded-Host $host;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_request_buffering off;
    }

    location /api/ {
      proxy_pass http://backend:8000;
      proxy_http_version 1.1;
      proxy_hide_header X-Content-Type-Options;
      proxy_hide_header X-Frame-Options;
      proxy_hide_header Referrer-Policy;
      proxy_hide_header Permissions-Policy;
      proxy_hide_header Cross-Origin-Opener-Policy;
      proxy_hide_header Cross-Origin-Resource-Policy;
      proxy_hide_header X-Permitted-Cross-Domain-Policies;
      proxy_hide_header Cache-Control;
      proxy_hide_header Strict-Transport-Security;
      proxy_hide_header Content-Security-Policy;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $calograph_forwarded_proto;
      proxy_set_header X-Forwarded-Host $host;
      proxy_read_timeout 300s;
      proxy_request_buffering off;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2|png|svg)$ {
      try_files $uri =404;
    }
  }
}
