version: 2

multi-ecosystem-groups:
  playwright:
    schedule:
      interval: weekly
      day: monday
      time: "04:10"
      timezone: Europe/Berlin

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Berlin
    groups:
      github-actions:
        patterns: ["*"]

  # The npm test runner and its browser image must always use the same version.
  - package-ecosystem: docker
    directory: /
    patterns: ["playwright"]
    multi-ecosystem-group: playwright

  - package-ecosystem: npm
    directory: /frontend
    patterns: ["@playwright/test"]
    multi-ecosystem-group: playwright
    allow:
      - dependency-name: "@playwright/test"
        dependency-type: development

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Europe/Berlin
    ignore:
      - dependency-name: playwright
    groups:
      container-bases:
        patterns: ["*"]
        exclude-patterns: ["node"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Europe/Berlin
    ignore:
      - dependency-name: "@playwright/test"
    groups:
      frontend-production:
        dependency-type: production
      frontend-development:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "04:45"
      timezone: Europe/Berlin
    groups:
      backend-dependencies:
        patterns: ["*"]
