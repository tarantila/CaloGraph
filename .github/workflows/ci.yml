name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_VERSION: 8.30.1

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.14.6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.29
          enable-cache: true
      - working-directory: backend
        run: uv lock --check
      - working-directory: backend
        run: uv sync --frozen --all-extras
      - name: Audit production Python dependencies
        working-directory: backend
        run: |
          uv export --frozen --no-dev --no-emit-project \
            >/tmp/calograph-production-requirements.txt
          uv run pip-audit --disable-pip \
            --requirement /tmp/calograph-production-requirements.txt
      - name: Audit complete Python environment
        working-directory: backend
        run: uv run pip-audit --skip-editable
      - working-directory: backend
        run: uv run ruff check app tests
      - working-directory: backend
        run: uv run mypy app
      - working-directory: backend
        run: uv run pytest

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_DB: calograph_test
          POSTGRES_USER: calograph_test
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U calograph_test -d calograph_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://calograph_test:ci-postgres-password@localhost:5432/calograph_test
      CALOGRAPH_POSTGRES_TEST_URL: postgresql+psycopg://calograph_test:ci-postgres-password@localhost:5432/calograph_test
      CALOGRAPH_ALLOW_DESTRUCTIVE_POSTGRES_TESTS: "1"
      SESSION_SECRET: test-session-secret-with-at-least-32-characters
      RATE_LIMIT_SECRET: test-rate-limit-secret-with-at-least-32-chars
      TRUSTED_HOSTS: testserver,localhost,127.0.0.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.14.6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.29
          enable-cache: true
      - working-directory: backend
        run: uv lock --check
      - working-directory: backend
        run: uv sync --frozen --all-extras
      - working-directory: backend
        run: uv run alembic upgrade head
      - working-directory: backend
        run: uv run alembic check
      - working-directory: backend
        run: >-
          uv run pytest
          tests/test_rate_limit_postgres.py
          tests/test_account_recovery_postgres.py
          tests/test_user_lifecycle_migration_postgres.py
          tests/test_yazio_migration_postgres.py
          tests/test_target_maintenance_migration_postgres.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify Playwright package and image versions match
        shell: bash
        run: |
          package_version=$(
            sed -nE \
              's/.*"@playwright\/test": "([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' \
              frontend/package.json
          )
          image_version=$(
            sed -nE \
              's|^FROM mcr\.microsoft\.com/playwright:v([0-9]+\.[0-9]+\.[0-9]+)-.* AS frontend-e2e$|\1|p' \
              Dockerfile
          )
          if [[ -z "$package_version" || -z "$image_version" ]]; then
            printf 'Unable to determine both Playwright versions.\n' >&2
            exit 1
          fi
          if [[ "$package_version" != "$image_version" ]]; then
            printf \
              'Playwright version mismatch: package=%s image=%s\n' \
              "$package_version" \
              "$image_version" >&2
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - name: Audit npm dependencies
        working-directory: frontend
        shell: bash
        run: |
          audit_output="$(mktemp)"
          trap 'rm -f "$audit_output"' EXIT

          audit_with_retry() {
            local attempt=1
            local status

            while true; do
              set +e
              npm audit "$@" >"$audit_output" 2>&1
              status=$?
              set -e
              cat "$audit_output"

              if (( status == 0 )); then
                return 0
              fi

              if ! grep -Eqi \
                'Service Unavailable|audit endpoint returned an error|ECONNRESET|ETIMEDOUT|EAI_AGAIN' \
                "$audit_output" || (( attempt >= 3 )); then
                return "$status"
              fi

              printf 'Transient npm audit failure; retrying (%d/3).\n' "$attempt"
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
          }

          audit_with_retry --omit=dev --audit-level=high
          audit_with_retry --audit-level=high
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npm run typecheck
      - working-directory: frontend
        run: npm run test:unit
      - working-directory: frontend
        run: npm run build

  containers-and-e2e:
    runs-on: ubuntu-latest
    needs: [secret-scan, backend, backend-postgres, frontend]
    env:
      CALOGRAPH_BACKEND_IMAGE: calograph-backend
      CALOGRAPH_FRONTEND_IMAGE: calograph-frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify project versions
        shell: bash
        run: |
          backend_version=$(awk -F'"' \
            '$1 ~ /^version = / {print $2; exit}' backend/pyproject.toml)
          frontend_version=$(awk -F'"' \
            '$2 == "version" {print $4; exit}' frontend/package.json)
          if [[ -z "$backend_version" || -z "$frontend_version" ]] \
            || [[ "$backend_version" != "$frontend_version" ]]; then
            printf \
              'Backend-/Frontend-Version stimmen nicht überein: backend=%s frontend=%s\n' \
              "$backend_version" "$frontend_version" >&2
            exit 1
          fi
          if [[ ! "$backend_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Ungültige Projektversion: %s\n' "$backend_version" >&2
            exit 1
          fi
          printf 'Projektversion: %s\n' "$backend_version"
      - name: Build runtime images
        shell: bash
        run: |
          project_version=$(awk -F'"' \
            '$1 ~ /^version = / {print $2; exit}' backend/pyproject.toml)
          docker build \
            --target backend-runtime \
            --build-arg "APP_VERSION=$project_version" \
            --build-arg "APP_REVISION=$GITHUB_SHA" \
            --tag calograph-backend:ci \
            .
          docker build \
            --target frontend-runtime \
            --build-arg "APP_VERSION=$project_version" \
            --build-arg "APP_REVISION=$GITHUB_SHA" \
            --tag calograph-frontend:ci \
            .
      - name: Scan backend runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: calograph-backend:ci
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          vuln-type: os,library
          scanners: vuln
      - name: Scan frontend runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: calograph-frontend:ci
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          vuln-type: os,library
          scanners: vuln
      - run: mkdir -p sbom
      - name: Create backend SPDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: calograph-backend:ci
          format: spdx-json
          output: sbom/calograph-backend.spdx.json
          vuln-type: os,library
          scanners: vuln
      - name: Create frontend SPDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: calograph-frontend:ci
          format: spdx-json
          output: sbom/calograph-frontend.spdx.json
          vuln-type: os,library
          scanners: vuln
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-sboms-${{ github.run_id }}
          path: sbom/*.spdx.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30
      - run: sudo apt-get update && sudo apt-get install --yes age
      - run: cp .env.example .env
      - run: ./scripts/init-secrets.sh
      - name: Test the prebuilt runtime images
        env:
          CALOGRAPH_VERSION: ci
          E2E_USE_PREBUILT_IMAGES: "true"
        run: ./scripts/e2e.sh
      - name: Run production smoke checks against prebuilt images
        env:
          CALOGRAPH_VERSION: ci
          PRODUCTION_SMOKE_USE_PREBUILT_IMAGES: "true"
        run: ./scripts/production-smoke.sh
      - name: Export verified runtime images for main publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          mkdir -p image-bundle
          docker save calograph-backend:ci calograph-frontend:ci \
            | gzip > image-bundle/runtime-images.tar.gz
      - name: Upload verified runtime images for main publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-images-${{ github.run_id }}
          path: image-bundle/runtime-images.tar.gz
          if-no-files-found: error
          overwrite: true
          retention-days: 3
      - if: always()
        run: docker compose logs --no-color --tail=300
      - if: always()
        run: docker compose down --volumes --remove-orphans

  publish-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [containers-and-e2e]
    concurrency:
      # edge is shared across all successful main publications.
      group: ci-publish-edge
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      CALOGRAPH_BACKEND_IMAGE: calograph-backend
      CALOGRAPH_FRONTEND_IMAGE: calograph-frontend
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: runtime-images-${{ github.run_id }}
          path: image-bundle
      - name: Load verified runtime images
        shell: bash
        run: |
          gzip -dc image-bundle/runtime-images.tar.gz | docker load
          docker image inspect \
            calograph-backend:ci calograph-frontend:ci >/dev/null
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: runtime-sboms-${{ github.run_id }}
          path: sbom
      - name: Prepare image names
        id: images
        shell: bash
        run: |
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          printf 'backend=ghcr.io/%s/calograph-backend\n' "$owner" >>"$GITHUB_OUTPUT"
          printf 'frontend=ghcr.io/%s/calograph-frontend\n' "$owner" >>"$GITHUB_OUTPUT"
      - name: Sign in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Push immutable tested images
        id: publish
        shell: bash
        env:
          BACKEND_IMAGE: ${{ steps.images.outputs.backend }}
          FRONTEND_IMAGE: ${{ steps.images.outputs.frontend }}
        run: |
          set -Eeuo pipefail
          immutable_tag="sha-${GITHUB_SHA}"
          run_tag="run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          inspect_digest() {
            local image_ref=$1
            local output
            if output=$(docker buildx imagetools inspect "$image_ref" 2>&1); then
              printf '%s\n' "$output" | awk '$1 == "Digest:" {print $2; exit}'
            else
              case "$output" in
                *"not found"*|*"Not Found"*|*"no such manifest"*|*"No such manifest"*|*"MANIFEST_UNKNOWN"*|*"manifest unknown"*) return 2 ;;
                *) printf '%s\n' "$output" >&2; return 1 ;;
              esac
            fi
          }

          publish_or_reuse() {
            local image=$1
            local run_ref="${image}:${run_tag}"
            local immutable_ref="${image}:${immutable_tag}"
            local local_digest
            local existing_digest
            docker push "$run_ref" >/dev/null
            local_digest=$(inspect_digest "$run_ref")
            [[ "$local_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            if existing_digest=$(inspect_digest "$immutable_ref"); then
              :
            else
              inspect_status=$?
              [[ "$inspect_status" -eq 2 ]]
              docker push "$immutable_ref" >/dev/null
              existing_digest=$(inspect_digest "$immutable_ref")
            fi
            [[ "$existing_digest" == "$local_digest" ]]
            printf '%s\n' "$existing_digest"
          }

          docker tag calograph-backend:ci "${BACKEND_IMAGE}:${run_tag}"
          docker tag calograph-backend:ci "${BACKEND_IMAGE}:${immutable_tag}"
          docker tag calograph-frontend:ci "${FRONTEND_IMAGE}:${run_tag}"
          docker tag calograph-frontend:ci "${FRONTEND_IMAGE}:${immutable_tag}"
          backend_digest=$(publish_or_reuse "$BACKEND_IMAGE")
          frontend_digest=$(publish_or_reuse "$FRONTEND_IMAGE")
          printf 'backend_digest=%s\n' "$backend_digest" >>"$GITHUB_OUTPUT"
          printf 'frontend_digest=%s\n' "$frontend_digest" >>"$GITHUB_OUTPUT"

      - name: Attest backend build provenance
        if: github.event.repository.private == false
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.images.outputs.backend }}
          subject-digest: ${{ steps.publish.outputs.backend_digest }}
          push-to-registry: true
      - name: Attest frontend build provenance
        if: github.event.repository.private == false
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.images.outputs.frontend }}
          subject-digest: ${{ steps.publish.outputs.frontend_digest }}
          push-to-registry: true
      - name: Attest backend SPDX SBOM
        if: github.event.repository.private == false
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.images.outputs.backend }}
          subject-digest: ${{ steps.publish.outputs.backend_digest }}
          sbom-path: sbom/calograph-backend.spdx.json
          push-to-registry: true
      - name: Attest frontend SPDX SBOM
        if: github.event.repository.private == false
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.images.outputs.frontend }}
          subject-digest: ${{ steps.publish.outputs.frontend_digest }}
          sbom-path: sbom/calograph-frontend.spdx.json
          push-to-registry: true
      - name: Promote verified digest to edge
        shell: bash
        env:
          BACKEND_IMAGE: ${{ steps.images.outputs.backend }}
          FRONTEND_IMAGE: ${{ steps.images.outputs.frontend }}
          BACKEND_DIGEST: ${{ steps.publish.outputs.backend_digest }}
          FRONTEND_DIGEST: ${{ steps.publish.outputs.frontend_digest }}
        run: |
          set -Eeuo pipefail
          docker tag calograph-backend:ci "${BACKEND_IMAGE}:edge"
          docker tag calograph-frontend:ci "${FRONTEND_IMAGE}:edge"
          docker push "${BACKEND_IMAGE}:edge"
          docker push "${FRONTEND_IMAGE}:edge"

          backend_edge_digest=$(docker buildx imagetools inspect \
            "${BACKEND_IMAGE}:edge" |
            awk '$1 == "Digest:" {print $2; exit}')
          frontend_edge_digest=$(docker buildx imagetools inspect \
            "${FRONTEND_IMAGE}:edge" |
            awk '$1 == "Digest:" {print $2; exit}')
          [[ "$backend_edge_digest" == "$BACKEND_DIGEST" ]]
          [[ "$frontend_edge_digest" == "$FRONTEND_DIGEST" ]]
          printf 'backend_edge_digest=%s\n' "$backend_edge_digest" >>"$GITHUB_OUTPUT"
          printf 'frontend_edge_digest=%s\n' "$frontend_edge_digest" >>"$GITHUB_OUTPUT"
      - if: always()
        run: docker logout ghcr.io
