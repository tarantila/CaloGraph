name: Clean up container images

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report candidates without deleting them
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  packages: write
  attestations: write

# Cleanup cannot race any image publication or promotion.
concurrency:
  group: container-image-promotions
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      RETENTION_DAYS: "7"
      MANUAL_DRY_RUN: ${{ inputs.dry_run }}
      OWNER_TYPE: ${{ github.event.repository.owner.type }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Classify and delete eligible image versions
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            dry_run="${MANUAL_DRY_RUN:-true}"
          elif [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            dry_run=false
          else
            printf 'Unsupported event: %s\n' "$GITHUB_EVENT_NAME" >&2
            exit 1
          fi

          if [[ "$OWNER_TYPE" == "Organization" ]]; then
            owner_scope=orgs
          else
            owner_scope=users
          fi

          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          cutoff_epoch=$(date --utc --date="-${RETENTION_DAYS} days" +%s)

          printf '%s' "$GH_TOKEN" \
            | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

          for package in calograph-backend calograph-frontend calograph-backup-agent; do
            pages_file="${RUNNER_TEMP}/${package}-pages.json"
            versions_file="${RUNNER_TEMP}/${package}-versions.json"
            protected_digests_file="${RUNNER_TEMP}/${package}-protected-digests.txt"
            referrer_candidates_file="${RUNNER_TEMP}/${package}-referrer-candidates.txt"
            subject_candidates_file="${RUNNER_TEMP}/${package}-subject-candidates.txt"
            attestation_subjects_file="${RUNNER_TEMP}/${package}-attestation-subjects.txt"
            api_base="/${owner_scope}/${GITHUB_REPOSITORY_OWNER}/packages/container/${package}/versions"
            attestation_base="/${owner_scope}/${GITHUB_REPOSITORY_OWNER}/attestations/digest"
            image="ghcr.io/${owner}/${package}"

            : >"$referrer_candidates_file"
            : >"$subject_candidates_file"
            : >"$attestation_subjects_file"

            if ! gh api --paginate "${api_base}?per_page=100" >"$pages_file"; then
              printf '%s: SKIP package unavailable or not manageable\n' "$package"
              continue
            fi
            jq -s 'add // []' "$pages_file" >"$versions_file"

            jq -r '
              .[]
              | select(
                  (.metadata.container.tags // [])
                  | any(
                      . == "latest"
                      or . == "edge"
                      or test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")
                    )
                )
              | .name
            ' "$versions_file" | sort -u >"$protected_digests_file"

            while IFS=$'\t' read -r version_id digest created_at tags; do
              if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                printf '%s SKIP INVALID DIGEST version=%s created_at=%s tags=%s digest=%s\n' \
                  "$package" "$version_id" "$created_at" "${tags:-<none>}" "$digest"
                continue
              fi

              protected_tag=false
              if [[ -n "$tags" ]]; then
                IFS=',' read -ra tag_list <<<"$tags"
                for tag in "${tag_list[@]}"; do
                  if [[ "$tag" == "latest" || "$tag" == "edge" \
                    || "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                    protected_tag=true
                    break
                  fi
                done
              fi

              if [[ "$protected_tag" == "true" ]] \
                || grep -Fxq "$digest" "$protected_digests_file"; then
                printf '%s PROTECTED version=%s created_at=%s tags=%s digest=%s\n' \
                  "$package" "$version_id" "$created_at" "${tags:-<none>}" "$digest"
                continue
              fi

              created_epoch=$(date --utc --date="$created_at" +%s)
              if (( created_epoch >= cutoff_epoch )); then
                printf '%s SKIP version=%s created_at=%s tags=%s digest=%s\n' \
                  "$package" "$version_id" "$created_at" "${tags:-<none>}" "$digest"
                continue
              fi

              if [[ -z "$tags" ]]; then
                manifest_file="${RUNNER_TEMP}/${package}-${version_id}-manifest.json"
                inspect_error_file="${RUNNER_TEMP}/${package}-${version_id}-inspect-error.txt"
                if ! docker buildx imagetools inspect --raw "${image}@${digest}" \
                  >"$manifest_file" 2>"$inspect_error_file"; then
                  printf '%s SKIP INSPECT ERROR version=%s created_at=%s digest=%s error=%s\n' \
                    "$package" "$version_id" "$created_at" "$digest" \
                    "$(tr '\n' ' ' <"$inspect_error_file")"
                  continue
                fi

                subject_digest=$(jq -r '.subject.digest // empty' "$manifest_file")
                if [[ -n "$subject_digest" ]]; then
                  if [[ ! "$subject_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                    printf '%s SKIP INVALID REFERRER version=%s created_at=%s digest=%s subject=%s\n' \
                      "$package" "$version_id" "$created_at" "$digest" "$subject_digest"
                    continue
                  fi

                  if grep -Fxq "$subject_digest" "$protected_digests_file"; then
                    printf '%s PROTECTED REFERRER version=%s created_at=%s digest=%s subject=%s\n' \
                      "$package" "$version_id" "$created_at" "$digest" "$subject_digest"
                    continue
                  fi

                  printf '%s DELETE CANDIDATE REFERRER version=%s created_at=%s digest=%s subject=%s\n' \
                    "$package" "$version_id" "$created_at" "$digest" "$subject_digest"
                  printf '%s\n' "$version_id" >>"$referrer_candidates_file"
                  printf '%s\n' "$subject_digest" >>"$attestation_subjects_file"
                  continue
                fi

                printf '%s DELETE CANDIDATE UNTAGGED version=%s created_at=%s digest=%s\n' \
                  "$package" "$version_id" "$created_at" "$digest"
                printf '%s\n' "$version_id" >>"$subject_candidates_file"
                printf '%s\n' "$digest" >>"$attestation_subjects_file"
                continue
              fi

              printf '%s DELETE CANDIDATE version=%s created_at=%s tags=%s digest=%s\n' \
                "$package" "$version_id" "$created_at" "$tags" "$digest"
              printf '%s\n' "$version_id" >>"$subject_candidates_file"
              printf '%s\n' "$digest" >>"$attestation_subjects_file"
            done < <(
              jq -r '
                .[]
                | [
                    (.id | tostring),
                    (.name // ""),
                    .created_at,
                    ((.metadata.container.tags // []) | join(","))
                  ]
                | @tsv
              ' "$versions_file"
            )

            if [[ "$dry_run" == "true" ]]; then
              continue
            fi

            for candidates_file in "$referrer_candidates_file" "$subject_candidates_file"; do
              sort -u "$candidates_file" | while IFS= read -r version_id; do
                [[ -n "$version_id" ]] || continue
                gh api --method DELETE "${api_base}/${version_id}"
              done
            done

            sort -u "$attestation_subjects_file" | while IFS= read -r subject_digest; do
              [[ -n "$subject_digest" ]] || continue
              error_file="${RUNNER_TEMP}/${package}-attestation-delete-error.txt"
              if ! gh api --method DELETE "${attestation_base}/${subject_digest}" \
                2>"$error_file"; then
                error=$(cat "$error_file")
                if [[ "$error" == *"HTTP 404"* || "$error" == *"Not Found"* ]]; then
                  printf '%s: no stored GitHub attestation for %s\n' \
                    "$package" "$subject_digest"
                else
                  printf '%s\n' "$error" >&2
                  exit 1
                fi
              fi
            done
          done

          if [[ "$dry_run" == "true" ]]; then
            printf 'Dry run only; no package version or attestation was deleted.\n'
          fi
