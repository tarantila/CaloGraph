# Explicit opt-in override for the single backup agent's environment/secrets archive.
# Use with: docker compose -f docker-compose.yml -f docker-compose.backup-secrets.yml \
#   --profile backup up -d backup-agent
services:
  backup-agent:
    environment:
      BACKUP_INCLUDE_SECRETS: "true"
      SECRETS_SOURCE_FILE: /backup-input/environment.env
      SECRETS_SOURCE_DIR: /backup-input/secrets
    volumes:
      - ${BACKUP_SECRETS_SOURCE_FILE:-./.env}:/backup-input/environment.env:ro
      - ${BACKUP_SECRETS_SOURCE_DIR:-./secrets}:/backup-input/secrets:ro
